<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>社員登録</title></head>
<body>
<form th:action="@{/employees}" method="post" th:object="${employeeForm}">
  <label>氏名 <input th:field="*{name}"></label>
  <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">入力エラー</p>
  <button type="submit">登録</button>
</form>
</body>
</html>
