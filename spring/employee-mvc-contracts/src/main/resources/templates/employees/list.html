<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>社員一覧</title></head>
<body>
<h1>社員一覧</h1>
<ul><li th:each="employee : ${employees}" th:text="${employee.name}">社員</li></ul>
<form th:action="@{/employees}" method="post" th:object="${employeeForm}">
  <label>氏名 <input th:field="*{name}"></label>
  <button type="submit">登録</button>
</form>
</body>
</html>
