spring.datasource.url=jdbc:h2:mem:jpa-reference-boundary
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jpa.compliance.proxy=false
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.session_factory.statement_inspector=info.syachiku.reference.SqlCapture
