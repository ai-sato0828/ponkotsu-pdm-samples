<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>注文検索</title></head>
<body>
<h1>注文検索</h1>
<form method="get" th:action="@{/orders}" th:object="${searchForm}">
    <label>キーワード <input th:field="*{keyword}"></label>
    <label>状態 <input th:field="*{status}"></label>
    <label>開始日 <input th:field="*{fromDate}" placeholder="YYYY-MM-DD"></label>
    <span th:errors="*{fromDate}"></span>
    <label>終了日 <input th:field="*{toDate}" placeholder="YYYY-MM-DD"></label>
    <span th:errors="*{toDate}"></span>
    <label>担当者 <input th:field="*{staffId}"></label>
    <label>ページ <input th:field="*{page}" inputmode="numeric"></label>
    <span th:errors="*{page}"></span>
    <button type="submit">検索</button>
</form>
<ul th:if="${orders != null}">
    <li th:each="order : ${orders}" th:text="${order.id() + ' ' + order.name()}"></li>
</ul>
</body>
</html>
