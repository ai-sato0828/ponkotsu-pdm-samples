<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>利用者登録</title></head>
<body>
<h1>利用者登録</h1>
<p th:if="${param.registered != null}">登録しました</p>
<p th:if="${showCorrectionNotice}">入力内容を確認してください</p>
<form method="post" th:action="@{/users}" th:object="${userRegisterForm}">
    <label>氏名 <input type="text" th:field="*{name}"></label>
    <span th:errors="*{name}"></span>
    <label>部署
        <select th:field="*{department}">
            <option th:each="department : ${departments}"
                    th:value="${department.code()}" th:text="${department.label()}"></option>
        </select>
    </label>
    <span th:errors="*{department}"></span>
    <label>利用枠 <input type="text" inputmode="numeric" th:field="*{seatLimit}"></label>
    <span th:errors="*{seatLimit}"></span>
    <button type="submit">登録</button>
</form>
</body>
</html>
