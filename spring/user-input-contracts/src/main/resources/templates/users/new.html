<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>利用者の登録</title></head>
<body>
<h1>利用者の登録</h1>
<form method="post" th:action="@{/users}" th:object="${registration}">
    <label>氏名 <input th:field="*{name}"></label>
    <span th:errors="*{name}"></span>
    <label>メールアドレス <input type="email" th:field="*{email}"></label>
    <span th:errors="*{email}"></span>
    <button type="submit">登録</button>
</form>
</body>
</html>
