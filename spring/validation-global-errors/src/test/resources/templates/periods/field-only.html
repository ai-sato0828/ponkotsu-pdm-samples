<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>期間入力</title></head>
<body>
<h1>期間入力</h1>
<form th:action="@{/periods}" th:object="${periodForm}" method="post">
  <label for="startDate">開始日</label>
  <input type="date" th:field="*{startDate}">
  <p id="start-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>
  <label for="endDate">終了日</label>
  <input type="date" th:field="*{endDate}">
  <p id="end-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></p>
  <button type="submit">確認</button>
</form>
</body>
</html>
