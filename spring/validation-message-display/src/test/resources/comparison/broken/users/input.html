<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>ユーザー登録</title></head>
<body>
<h1>ユーザー登録</h1>
<form th:action="@{/users}" th:object="${userForm}" method="post">
  <label for="name">名前</label>
  <input type="text" th:field="*{name}">
  <p id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{email}"></p>
  <label for="email">メール（任意）</label>
  <input type="email" th:field="*{email}">
  <p id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
  <button type="submit">登録</button>
</form>
</body>
</html>
